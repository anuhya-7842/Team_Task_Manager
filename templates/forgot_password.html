<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
</head>
<body>

<h1>Reset Password</h1>

<form method="POST">

    <input
        type="email"
        name="email"
        placeholder="Enter Email"
    >

    <br><br>

    <input
        type="password"
        name="new_password"
        placeholder="New Password"
    >

    <br><br>

    <button>Reset Password</button>

</form>

</body>
</html>
