<!DOCTYPE html>
<html>
<head>
    <title>All Tasks</title>
</head>
<body>

<h1>All Tasks</h1>

{% for task in tasks %}

    <h3>Task: {{ task.title }}</h3>

    <p>Assigned To: {{ task.assigned_to }}</p>

    <p>Due Date: {{ task.due_date }}</p>

    <p>Status: {{ task.status }}</p>

    <hr>

{% endfor %}

</body>
</html>
